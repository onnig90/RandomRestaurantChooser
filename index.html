<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spin & Eat - Random Restaurant Chooser</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Section 1 — Header / Auth Bar -->
        <header class="auth-bar">
            <button id="btn-auth-guest" class="btn btn-outline">Sign up / Log in to save your filters</button>
            <button id="btn-auth-user" class="btn btn-secondary hidden">Load filters</button>
        </header>

        <!-- Section 2 — Filter Panel -->
        <section class="filter-panel card">
            <div class="filter-group">
                <label for="location-input">Location Request</label>
                <div class="input-with-icon">
                    <input type="text" id="location-input" placeholder="Detecting location..." />
                    <span class="icon">📍</span>
                </div>
            </div>
            <div class="filter-group">
                <label for="cuisine-select">Cuisine</label>
                <select id="cuisine-select">
                    <option value="any">Any Cuisine</option>
                    <option value="pizza">Pizza</option>
                    <option value="sushi">Sushi</option>
                    <option value="mexican">Mexican</option>
                    <option value="burgers">Burgers</option>
                    <option value="thai">Thai</option>
                    <option value="italian">Italian</option>
                    <option value="chinese">Chinese</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="distance-input">Max Travel Distance (km)</label>
                <div class="slider-container">
                    <input type="range" id="distance-input" min="1" max="25" value="5">
                    <span id="distance-val">5 km</span>
                </div>
            </div>
            <div class="filter-group price-filter">
                <label>Price Range</label>
                <div class="price-options">
                    <button class="price-btn active" data-val="1">$</button>
                    <button class="price-btn active" data-val="2">$$</button>
                    <button class="price-btn active" data-val="3">$$$</button>
                    <button class="price-btn" data-val="4">$$$$</button>
                </div>
            </div>
            <div class="filter-group">
                <label>Time Range</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="open-now-toggle" checked>
                    <span class="slider"></span>
                    <span class="toggle-label">Open Now</span>
                </label>
            </div>
        </section>

        <!-- Section 3 — Spin CTA -->
        <section class="spin-cta-section">
            <button id="btn-spin" class="btn btn-primary btn-spin">✦ Spin the wheel</button>
        </section>

        <!-- Section 4 — Wheel Section (Integrated from User Code) -->
        <section class="wheel-section">
            <div class="pointer" id="pointer">
                <div class="ptr-line"></div>
                <div class="ptr-arrow"></div>
            </div>
            <div class="wheel-clip">
                <canvas id="wheel" width="600" height="600"></canvas>
                <div class="glow" id="glow"></div>
            </div>
        </section>

        <!-- Result Display -->
        <div class="result" id="result-text"></div>

        <!-- Section 5 — Result Details Display -->
        <section class="result-display hidden" id="result-display">
            <h2 id="res-name">Restaurant Name</h2>
            <p id="res-details"><span id="res-rating">4.5 ⭐</span>  •  <span id="res-price">$$$</span></p>
            <p id="res-addr">123 Main St, City</p>
            
            <div class="result-actions">
                <button id="btn-share" class="btn btn-primary">Share with your friends</button>
                <button id="btn-itinerary" class="btn btn-outline">View itinerary</button>
            </div>
            <div id="guest-post-spin-prompt" class="guest-prompt">
                <button id="btn-signup-prompt" class="btn btn-text">Sign up to save your filters</button>
            </div>
            <div id="user-post-spin-prompt" class="user-prompt hidden">
                <button id="btn-save-filters" class="btn btn-secondary">Save filters</button>
            </div>
        </section>

        <!-- Section 6 — Map Widget -->
        <section class="map-section hidden" id="map-section">
            <div id="map-widget" class="map-container"></div>
            <a id="btn-open-itinerary" target="_blank" href="#" class="btn btn-outline map-cta">Open itinerary in Maps</a>
        </section>
        
        <!-- Toast for errors/info -->
        <div id="toast" class="toast hidden"></div>
    </div>

    <!-- Scripts -->
    <script src="js/share.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/app.js"></script>
    <!-- Google Maps API Placeholder -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAfxwmRKoLC7BfpLeD-T2n5FwRRVKFUOgU&callback=initMapPlaceholder&libraries=places"></script>
</body>
</html>
